{{/* Project-only header of the Photography page: title, one line of intro
     and a link to the Instagram account. */}}
{{ $page := .wcPage }}
{{ $c := .wcBlock.content }}
<header class="pg-head">
  <h1 class="pg-title">{{ $c.title }}</h1>
  {{ with $c.intro }}<p class="pg-intro">{{ . | $page.RenderString }}</p>{{ end }}
  {{ with $c.instagram }}
  <a class="pg-insta" href="{{ .url }}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/></svg>
    <span>{{ .text }}</span>
  </a>
  {{ end }}
</header>
