<script>
// Magnifying-glass lens for `.lens-container` images (see
// layouts/partials/blox/image-full-bleed.html). Desktop/mouse only: devices
// without a fine pointer never get the listeners attached, so touch is
// unaffected.
(function () {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  document.querySelectorAll('.lens-container').forEach(function (container) {
    var lens = container.querySelector('.lens');
    var zoomSrc = container.dataset.zoomSrc;
    var zoomFactor = parseFloat(container.dataset.zoomFactor) || 3;
    var zoomLoaded = false;

    function move(e) {
      var rect = container.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;

      if (!zoomLoaded) {
        lens.style.backgroundImage = 'url(' + zoomSrc + ')';
        zoomLoaded = true;
      }

      var half = lens.offsetWidth / 2;
      lens.style.left = (x - half) + 'px';
      lens.style.top = (y - half) + 'px';
      lens.style.backgroundSize = (rect.width * zoomFactor) + 'px ' + (rect.height * zoomFactor) + 'px';
      lens.style.backgroundPosition = -(x * zoomFactor - half) + 'px ' + -(y * zoomFactor - half) + 'px';
    }

    container.addEventListener('mouseenter', function (e) {
      lens.style.display = 'block';
      move(e);
    });
    container.addEventListener('mousemove', move);
    container.addEventListener('mouseleave', function () {
      lens.style.display = 'none';
    });
  });
})();
</script>
